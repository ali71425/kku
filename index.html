<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
جامعة الملك خالد - قسم اللغة العربية
</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap"
rel="stylesheet">

<style>

:root{

--kku-green:#005826;
--kku-grey:#707070;

}

*{

box-sizing:border-box;

}

body{

margin:0;
font-family:'Tajawal',sans-serif;
background:#f4f4f4;

}

/****************************************
 * شاشة البداية
 ****************************************/

#splash-screen{

position:fixed;
inset:0;

background:white;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

z-index:999;

transition:.8s;

}

.logo-flash{

width:220px;

animation:flashEffect 2s ease;

}

@keyframes flashEffect{

0%{

opacity:0;
transform:scale(.9);

}

50%{

opacity:1;
transform:scale(1.05);

}

100%{

opacity:1;
transform:scale(1);

}

}

#welcome-section{

display:none;

text-align:center;

animation:fadeIn 1s ease;

margin-top:25px;

}

#welcome-section h2{

color:var(--kku-green);

margin-bottom:10px;

font-size:32px;

}

#welcome-section p{

color:#666;

margin-bottom:25px;

font-size:18px;

}

#next-btn{

background:transparent;

border:2px solid var(--kku-green);

color:var(--kku-green);

padding:12px 40px;

border-radius:30px;

font-family:'Tajawal';

font-size:18px;

cursor:pointer;

transition:.3s;

font-weight:bold;

}

#next-btn:hover{

background:var(--kku-green);

color:white;

}

@keyframes fadeIn{

from{

opacity:0;
transform:translateY(10px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/****************************************
 * المحتوى الرئيسي
 ****************************************/

#main-content{

display:none;

max-width:900px;

margin:40px auto;

background:white;

padding:40px;

border-radius:20px;

border-top:8px solid var(--kku-green);

box-shadow:0 10px 30px rgba(0,0,0,.05);

}

header{

text-align:center;

margin-bottom:35px;

}

header img{

width:160px;

margin-bottom:10px;

}

.section-title{

color:var(--kku-green);

font-size:22px;

margin-top:40px;
margin-bottom:20px;

border-bottom:2px solid #eee;

padding-bottom:10px;

}

.form-group{

margin-bottom:22px;

}

.row{

display:flex;
gap:15px;

}

.row .form-group{

flex:1;

}

label{

display:block;

margin-bottom:8px;

font-weight:bold;

color:var(--kku-green);

}

input,
select,
textarea{

width:100%;

padding:14px;

border-radius:10px;

border:1px solid #ddd;

font-family:'Tajawal';

font-size:15px;

transition:.3s;

}

input:focus,
select:focus,
textarea:focus{

outline:none;

border-color:var(--kku-green);

box-shadow:0 0 0 3px rgba(0,88,38,.1);

}

textarea{

resize:vertical;

}

.file-note{

font-size:13px;

color:#888;

margin-top:6px;

}

.submit-btn{

width:100%;

padding:16px;

border:none;

border-radius:12px;

background:var(--kku-green);

color:white;

font-size:18px;

font-family:'Tajawal';

cursor:pointer;

transition:.3s;

font-weight:bold;

}

.submit-btn:hover{

background:#00401c;

}

.file-item{

display:flex;

justify-content:space-between;

align-items:center;

background:#f7f7f7;

padding:10px;

margin-top:8px;

border-radius:8px;

}

.file-item button{

background:red;

color:white;

border:none;

padding:5px 10px;

border-radius:5px;

cursor:pointer;

}

#final-thanks{

display:none;

text-align:center;

padding:40px;

}

#final-thanks h2{

color:var(--kku-green);

}

/****************************************
 * شاشة التحميل
 ****************************************/

#loading-overlay{

position:fixed;

inset:0;

background:rgba(255,255,255,.92);

display:none;

justify-content:center;

align-items:center;

z-index:9999;

backdrop-filter:blur(3px);

}

.loading-box{

text-align:center;

}

.loading-box p{

margin-top:20px;

font-size:20px;

color:var(--kku-green);

font-weight:bold;

}

.loader{

width:70px;
height:70px;

border:6px solid #ddd;

border-top:6px solid var(--kku-green);

border-radius:50%;

animation:spin 1s linear infinite;

margin:auto;

}

@keyframes spin{

0%{

transform:rotate(0deg);

}

100%{

transform:rotate(360deg);

}

}

@media(max-width:768px){

.row{

flex-direction:column;

}

#main-content{

margin:15px;
padding:25px;

}

}

</style>

</head>

<body>

<!-- شاشة البداية -->

<div id="splash-screen">

<img src="شعار_جامعة_الملك_خالد.png"
class="logo-flash">

<div id="welcome-section">

<h2>
أهلاً بكم
</h2>

<p>
استمارة جمع بيانات التقرير السنوي
</p>

<button id="next-btn">

التالي

</button>

</div>

</div>

<!-- المحتوى الرئيسي -->

<div id="main-content">

<header>

<img src="شعار_جامعة_الملك_خالد.png">

<h2 style="color:var(--kku-grey)">
قسم اللغة العربية وآدابها
</h2>

<p style="color:#888">
التقرير السنوي
</p>

</header>

<form id="kku-data-form">

<!-- البيانات الأساسية -->

<div class="section-title">
البيانات الأساسية
</div>

<div class="form-group">

<label>
الاسم الرباعي
</label>

<input type="text"
name="name"
required>

</div>

<div class="row">

<div class="form-group">

<label>
النوع
</label>

<select name="gender">

<option value="ذكر">
ذكر
</option>

<option value="أنثى">
أنثى
</option>

</select>

</div>

<div class="form-group">

<label>
الرقم الوظيفي
</label>

<input type="number"
name="emp_id"
required>

</div>

</div>

<div class="form-group">

<label>
الدرجة العلمية
</label>

<select name="rank">

<option value="أستاذ">
أستاذ
</option>

<option value="أستاذ مشارك">
أستاذ مشارك
</option>

<option value="أستاذ مساعد">
أستاذ مساعد
</option>

<option value="محاضر">
محاضر
</option>

<option value="معيد">
معيد
</option>

</select>

</div>

<div class="form-group">

<label>
رقم الجوال
</label>

<input type="tel"
name="phone">

</div>

<!-- الدورات -->

<div class="section-title">
الدورات والبرامج المقدمة
</div>

<div class="form-group">

<label>
الدورات والبرامج
</label>

<textarea name="courses"
rows="5"></textarea>

</div>

<div class="form-group">

<label>
رفع شواهد الدورات
</label>

<input type="file"
id="courses_files"
multiple
accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">

<div id="courses_preview"></div>

<div class="file-note">
يمكنك اختيار الملفات على دفعات متعددة
</div>

</div>

<!-- المناقشات -->

<div class="section-title">
المشاركات الخارجية 
</div>

<div class="form-group">

<label>
(الندوات-المناقشات-الدورات)
</label>

<textarea name="external_discussions"
rows="5"></textarea>

</div>

<div class="form-group">

<label>
رفع الشواهد 
</label>

<input type="file"
id="discussion_files"
multiple
accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">

<div id="discussion_preview"></div>

</div>

<!-- الانتاج البحثي -->

<div class="section-title">
الإنتاج البحثي والعلمي
</div>

<div class="form-group">

<label>
الإنتاج البحثي
</label>

<textarea name="research_output"
rows="5"></textarea>

</div>



<button type="submit"
class="submit-btn"
id="btn-text">

إرسال البيانات

</button>

</form>

<div id="final-thanks">

<h2>
شكراً لك
</h2>

<p>
تم حفظ البيانات بنجاح
</p>

</div>

</div>

<!-- شاشة الانتظار -->

<div id="loading-overlay">

<div class="loading-box">

<div class="loader"></div>

<p>
نأمل الانتظار ريثما يتم رفع الملفات وتسجيل ردك
</p>

</div>

</div>

<script>

/****************************************
 * شاشة البداية
 ****************************************/

window.onload = () => {

const welcome =
document.getElementById(
'welcome-section'
);

setTimeout(()=>{

welcome.style.display='block';

},1500);

};


/****************************************
 * الانتقال للنموذج
 ****************************************/

document.getElementById(
'next-btn'
).addEventListener(
'click',
()=>{

const splash =
document.getElementById(
'splash-screen'
);

splash.style.opacity='0';

setTimeout(()=>{

splash.style.display='none';

document.getElementById(
'main-content'
).style.display='block';

},800);

});


/****************************************
 * الملفات
 ****************************************/

const uploadedFiles = {

courses_files:[],
discussion_files:[]

};


/****************************************
 * تهيئة الحقول
 ****************************************/

setupFileInput(
'courses_files',
'courses_preview'
);

setupFileInput(
'discussion_files',
'discussion_preview'
);


/****************************************
 * إضافة ملفات
 ****************************************/

function setupFileInput(
inputId,
previewId
){

const input =
document.getElementById(
inputId
);

input.addEventListener(
'change',
()=>{

for(const file of input.files){

uploadedFiles[inputId]
.push(file);

}

renderFiles(
inputId,
previewId
);

input.value='';

}
);

}


/****************************************
 * عرض الملفات
 ****************************************/

function renderFiles(
inputId,
previewId
){

const preview =
document.getElementById(
previewId
);

preview.innerHTML='';

uploadedFiles[inputId]
.forEach((file,index)=>{

const item =
document.createElement('div');

item.className='file-item';

item.innerHTML=`

<span>
${file.name}
</span>

<button type="button"
onclick="removeFile(
'${inputId}',
${index},
'${previewId}'
)">
حذف
</button>

`;

preview.appendChild(item);

});

}


/****************************************
 * حذف ملف
 ****************************************/

function removeFile(
inputId,
index,
previewId
){

uploadedFiles[inputId]
.splice(index,1);

renderFiles(
inputId,
previewId
);

}


/****************************************
 * تحويل Base64
 ****************************************/

function toBase64(file){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();

reader.readAsDataURL(file);

reader.onload=
()=>resolve(reader.result);

reader.onerror=
error=>reject(error);

});

}


/****************************************
 * إرسال النموذج
 ****************************************/

const scriptURL =
'https://script.google.com/macros/s/AKfycbyQDOoYZxKC0DFQ-ocKMMlojSJCUMk3CGsc4-iwmnJd6gYeX0Oi1phLPxIhJgNgzdj3YA/exec';

const form =
document.getElementById(
'kku-data-form'
);

form.addEventListener(
'submit',
async(e)=>{

e.preventDefault();

const submitBtn =
document.getElementById(
'btn-text'
);

submitBtn.innerText=
'جاري الحفظ...';

submitBtn.disabled=true;

document.getElementById(
'loading-overlay'
).style.display='flex';

try{

const formData={

name:
form.name.value,

gender:
form.gender.value,

emp_id:
form.emp_id.value,

rank:
form.rank.value,

phone:
form.phone.value,

courses:
form.courses.value,

external_discussions:
form.external_discussions.value,

research_output:
form.research_output.value,

international_awards:
form.international_awards.value

};


/****************************************
 * معالجة الملفات
 ****************************************/

async function processFiles(
key
){

let result=[];

for(
const file of uploadedFiles[key]
){

const base64=
await toBase64(file);

result.push({

fileName:
file.name,

mimeType:
file.type,

data:
base64.split(',')[1]

});

}

return result;

}

formData.courses_files=
await processFiles(
'courses_files'
);

formData.discussion_files=
await processFiles(
'discussion_files'
);


/****************************************
 * إرسال البيانات
 ****************************************/

const response=
await fetch(scriptURL,{

method:'POST',

body:
JSON.stringify(formData)

});

const result=
await response.json();

if(
result.status==='success'
){

form.style.display='none';

document.getElementById(
'final-thanks'
).style.display='block';

}

else{

alert(result.message);

}

}

catch(error){

console.error(error);

alert(
'حدث خطأ أثناء الإرسال'
);

}

finally{

document.getElementById(
'loading-overlay'
).style.display='none';

submitBtn.innerText=
'إرسال البيانات';

submitBtn.disabled=false;

}

}
);

</script>

</body>
</html>
